name: publish go-pod

on:
  push:
    branches:
      - main
    tags:
      - '**'
    paths:
      - 'go-pod/*'
      - '.github/workflows/go-pod.yml'


jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      go_versions: ${{ steps.vars.outputs.go_versions }}
      latest_go_version: ${{ steps.vars.outputs.latest_go_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Go versions to build
        id: vars
        run: |
          echo "go_versions=$(grep -v '^\s*$' go-pod/go-versions.txt | jq -R . | jq -sc .)" >> $GITHUB_OUTPUT
          echo "latest_go_version=$(grep -v '^\s*$' go-pod/go-versions.txt | sort -V | tail -n1)" >> $GITHUB_OUTPUT

  build_image:
    needs: matrix
    runs-on: ubuntu-latest

    strategy:
      matrix:
        go_version: ${{ fromJSON(needs.matrix.outputs.go_versions) }}

    env:
      DOCKER_REPO: denisitpro/go-pod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Load app versions
        run: |
          cd go-pod
          while IFS='=' read -r key value; do
            echo "$key=$value" >> $GITHUB_ENV
          done < app-version.txt
          echo "MINOR=$(echo '${{ matrix.go_version }}' | cut -d. -f1,2)" >> $GITHUB_ENV
          # `latest` is pushed by the one matrix leg that builds the highest Go version (sort -V), never by the others
          if [ '${{ matrix.go_version }}' = '${{ needs.matrix.outputs.latest_go_version }}' ]; then
            echo "LATEST_TAG=${DOCKER_REPO}:latest" >> $GITHUB_ENV
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        id: create_builder
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./go-pod
          file: ./go-pod/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKER_REPO }}:${{ matrix.go_version }}
            ${{ env.DOCKER_REPO }}:${{ env.MINOR }}
            ${{ env.LATEST_TAG }}
          build-args: |
            GO_VERSION=${{ matrix.go_version }}
            GOLANGCI_LINT_VERSION=${{ env.GOLANGCI_LINT_VERSION }}
            GOVULNCHECK_VERSION=${{ env.GOVULNCHECK_VERSION }}
          builder: ${{ steps.create_builder.outputs.name }}
