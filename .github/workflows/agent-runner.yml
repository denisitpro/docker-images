name: publish agent-runner

on:
  push:
    branches:
      - main
    tags:
      - '**'
    paths:
      - 'agent-runner/*'  # only debug
      - '.github/workflows/agent-runner.yml'
#      - agent-runner/version.txt


jobs:
  build_image:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        image_folder: ['agent-runner']

    env:  # set global vas
      DOCKER_REPO: denisitpro/agent-runner
      DOCKER_FILE: Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract version
        id: vars
        run: |
          cd ${{ matrix.image_folder }}
          echo "VERSION=$(cat version.txt)"
          echo "VERSION=$(cat version.txt)" >> $GITHUB_ENV
          echo "TIMESTAMP=$(date -u +%Y%m%d%H%M%S)" >> $GITHUB_ENV

      - name: Load app versions
        run: |
          cd ${{ matrix.image_folder }}
          while IFS='=' read -r key value; do
            echo "$key=$value" >> $GITHUB_ENV
          done < app-version.txt

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        id: create_builder
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.image_folder }}
          file: ./${{ matrix.image_folder }}/${{ env.DOCKER_FILE }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKER_REPO }}:${{ env.VERSION }}
            ${{ env.DOCKER_REPO }}:latest
          build-args: |
            TIMESTAMP=${{ env.TIMESTAMP }}
            VERSION=${{ env.VERSION }}
            GO_VERSION=${{ env.GO_VERSION }}
            BUN_VERSION=${{ env.BUN_VERSION }}
            CUE_VERSION=${{ env.CUE_VERSION }}
            GOLANGCI_LINT_VERSION=${{ env.GOLANGCI_LINT_VERSION }}
            GOVULNCHECK_VERSION=${{ env.GOVULNCHECK_VERSION }}
            OASDIFF_VERSION=${{ env.OASDIFF_VERSION }}
          builder: ${{ steps.create_builder.outputs.name }}