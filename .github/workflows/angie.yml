name: mirror angie

on:
  push:
    paths:
      - 'angie/version.txt'


jobs:
  mirror_image:
    runs-on: ubuntu-latest

    env:
      SOURCE_IMAGE: docker.angie.software/angie
      TARGET_IMAGE: denisitpro/angie

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract version
        id: vars
        run: |
          cd angie
          VERSION=$(grep "^VERSION=" version.txt | cut -d'=' -f2)
          echo "VERSION=$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Mirror image
        run: |
          echo "Mirroring ${{ env.SOURCE_IMAGE }}:${{ env.VERSION }} to ${{ env.TARGET_IMAGE }}:${{ env.VERSION }}"
          docker buildx imagetools create \
            --tag ${{ env.TARGET_IMAGE }}:${{ env.VERSION }} \
            --tag ${{ env.TARGET_IMAGE }}:latest \
            ${{ env.SOURCE_IMAGE }}:${{ env.VERSION }}
